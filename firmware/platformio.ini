[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0
upload_speed = 921600
board_build.partitions = partitions.csv

build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; -D DEBUG_LOG

lib_deps =
  mathertel/OneButton
  ; bblanchon/ArduinoJson@^7.4.3
